name: deploy node js github actions practice app to aws instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

     
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd node-js-app-for-Github-actions-practice
            git pull origin main
            docker compose up -d --build